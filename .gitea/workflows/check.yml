# Runs on Sirius's Gitea runner for every push and pull request. The GitHub copy waits for it to pass.
name: check
on: [push, pull_request]

jobs:
  secrets:
    name: no secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (fails on passwords, keys and tokens anywhere in the git history)
        run: |
          V=8.30.1; F=gitleaks_${V}_linux_x64.tar.gz; B=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sfLO $B/$F && curl -sfL $B/gitleaks_${V}_checksums.txt | grep " $F$" | sha256sum -c -
          tar -xzf $F gitleaks && ./gitleaks git --redact --no-banner .

  structure:
    name: skills, references and router resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check.mjs

  shellcheck:
    name: shellcheck (warning level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck 0.10.0
        run: |
          V=0.10.0; F=shellcheck-v$V.linux.x86_64.tar.xz; B=https://github.com/koalaman/shellcheck/releases/download/v$V
          curl -sfLO $B/$F && echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $F" | sha256sum -c -
          tar -xJf $F && ./shellcheck-v$V/shellcheck --severity=warning scripts/link.sh skills/daz-mode/scripts/lane.sh skills/codebase-survey/scripts/inventory.sh

  scripts:
    name: daz-mode scripts test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bun 1.4.2
        run: curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2" >/dev/null && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - working-directory: skills/daz-mode/scripts
        run: bun install --frozen-lockfile && bun run typecheck && bun test
